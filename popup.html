<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 340px;
      font-family: 'Nunito', sans-serif;
      background: #0f0f13;
      color: #e8e6e3;
      overflow: hidden;
    }

    .container {
      padding: 24px;
      position: relative;
    }

    /* Decorative background */
    .container::before {
      content: '';
      position: absolute;
      top: -40px;
      right: -40px;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(255, 107, 53, 0.15), transparent 70%);
      pointer-events: none;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #ff6b35, #ff8c42);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 16px rgba(255, 107, 53, 0.3);
    }

    .header-text h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
      background: linear-gradient(135deg, #ff6b35, #ffb347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-text p {
      font-size: 11px;
      color: #6b6977;
      font-weight: 600;
    }

    /* Rate input section */
    .rate-section {
      background: #1a1a22;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid #2a2a35;
      position: relative;
      overflow: hidden;
    }

    .rate-section::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, #ff6b35, #ffb347, #ff6b35);
    }

    .rate-label {
      font-size: 12px;
      font-weight: 700;
      color: #8a8693;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 12px;
    }

    .rate-input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rate-input-box {
      flex: 1;
      position: relative;
    }

    .rate-input-box input {
      width: 100%;
      background: #12121a;
      border: 2px solid #2a2a35;
      border-radius: 12px;
      padding: 12px 50px 12px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      outline: none;
      transition: border-color 0.2s;
    }

    .rate-input-box input:focus {
      border-color: #ff6b35;
    }

    .rate-input-box .currency {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      font-weight: 700;
      color: #4a4856;
    }

    .per-hour {
      font-size: 13px;
      color: #6b6977;
      font-weight: 700;
      white-space: nowrap;
    }

    /* Toggle */
    .toggle-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1a22;
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 16px;
      border: 1px solid #2a2a35;
    }

    .toggle-text {
      font-size: 13px;
      font-weight: 700;
    }

    .toggle {
      position: relative;
      width: 48px;
      height: 26px;
      cursor: pointer;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #2a2a35;
      border-radius: 26px;
      transition: 0.3s;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      left: 3px;
      bottom: 3px;
      background: #6b6977;
      border-radius: 50%;
      transition: 0.3s;
    }

    .toggle input:checked + .toggle-slider {
      background: linear-gradient(135deg, #ff6b35, #ff8c42);
    }

    .toggle input:checked + .toggle-slider::before {
      transform: translateX(22px);
      background: #fff;
    }

    /* Salary calculator */
    .calc-section {
      background: #1a1a22;
      border-radius: 16px;
      padding: 16px 20px;
      border: 1px solid #2a2a35;
      margin-bottom: 16px;
    }

    .calc-title {
      font-size: 11px;
      font-weight: 700;
      color: #8a8693;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .calc-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .calc-row:last-child {
      margin-bottom: 0;
    }

    .calc-row label {
      font-size: 12px;
      color: #6b6977;
      width: 80px;
      flex-shrink: 0;
    }

    .calc-row input {
      flex: 1;
      min-width: 0;
      background: #12121a;
      border: 1.5px solid #2a2a35;
      border-radius: 8px;
      padding: 8px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      outline: none;
      transition: border-color 0.2s;
    }

    .calc-row input:focus {
      border-color: #ff6b35;
    }

    .calc-row .unit {
      font-size: 11px;
      color: #4a4856;
      width: 30px;
      font-weight: 700;
    }

    .calc-result {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #2a2a35;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .calc-result-label {
      font-size: 12px;
      color: #8a8693;
      font-weight: 700;
    }

    .calc-result-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: #ff6b35;
    }

    /* Mode toggle */
    .mode-section {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .mode-btn {
      flex: 1;
      padding: 8px;
      border: 1.5px solid #2a2a35;
      border-radius: 10px;
      background: transparent;
      color: #6b6977;
      font-family: 'Nunito', sans-serif;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .mode-btn.active {
      border-color: #ff6b35;
      color: #ff6b35;
      background: rgba(255, 107, 53, 0.08);
    }

    .mode-btn:hover:not(.active) {
      border-color: #3a3a45;
      color: #8a8693;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 13px;
      color: #8a8693;
      font-weight: 600;
      margin-top: 4px;
    }

    /* Status toast */
    .toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #22c55e;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 20px;
      border-radius: 20px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">⏱</div>
      <div class="header-text">
        <h1>Рубли → Часы</h1>
        <p>Переведи деньги во время</p>
      </div>
    </div>

    <!-- Mode: manual rate or salary calc -->
    <div class="mode-section">
      <button class="mode-btn active" data-mode="manual">Ставка вручную</button>
      <button class="mode-btn" data-mode="salary">Из зарплаты</button>
    </div>

    <!-- Manual rate -->
    <div class="rate-section" id="manualSection">
      <div class="rate-label">Твоя ставка</div>
      <div class="rate-input-wrap">
        <div class="rate-input-box">
          <input type="number" id="hourlyRate" placeholder="500" min="1" value="500">
          <span class="currency">₽</span>
        </div>
        <span class="per-hour">/ час</span>
      </div>
    </div>

    <!-- Salary calculator -->
    <div class="calc-section" id="salarySection" style="display: none;">
      <div class="calc-title">Рассчитать из зарплаты</div>
      <div class="calc-row">
        <label>Зарплата</label>
        <input type="number" id="salaryInput" placeholder="80000" min="1" value="80000">
        <span class="unit">₽</span>
      </div>
      <div class="calc-row">
        <label>Часов/нед</label>
        <input type="number" id="hoursPerWeek" value="40" min="1" max="168">
        <span class="unit">ч</span>
      </div>
      <div class="calc-result">
        <span class="calc-result-label">Ставка в час:</span>
        <span class="calc-result-value" id="calcRate">— ₽</span>
      </div>
    </div>

    <!-- Active toggle -->
    <div class="toggle-section">
      <span class="toggle-text">Заменять цены</span>
      <label class="toggle">
        <input type="checkbox" id="activeToggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <!-- Exchange rates -->
    <div class="calc-section" style="margin-bottom: 16px;">
      <div class="calc-title">Курс валют</div>
      <div class="calc-row">
        <label>1 USD</label>
        <input type="number" id="usdRate" value="90" min="1">
        <span class="unit">₽</span>
      </div>
      <div class="calc-row">
        <label>1 EUR</label>
        <input type="number" id="eurRate" value="100" min="1">
        <span class="unit">₽</span>
      </div>
    </div>

    <div class="footer">⏱ время — единственная валюта</div>
  </div>

  <div class="toast" id="toast">Сохранено ✓</div>

  <script src="popup.js"></script>
</body>
</html>
